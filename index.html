<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор зарплати</title>

<link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f4b0.svg">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#f8fafc,#e2e8f0);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:550px;
    background:#fff;
    border-radius:28px;
    padding:30px;
    box-shadow:0 20px 50px rgba(0,0,0,.12);
}

h1{
    text-align:center;
    margin-bottom:10px;
    color:#111827;
    font-size:30px;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    margin-bottom:25px;
    font-size:14px;
}

.input-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#374151;
    font-weight:600;
}

input{
    width:100%;
    padding:14px 16px;
    border:2px solid #e5e7eb;
    border-radius:14px;
    font-size:18px;
    transition:.2s;
}

input:focus{
    outline:none;
    border-color:#2563eb;
}

.result{
    margin-top:25px;
}

.section-title{
    font-weight:700;
    margin-top:18px;
    margin-bottom:8px;
    color:#111827;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid #f1f5f9;
}

.row span:first-child{
    color:#475569;
}

.row span:last-child{
    font-weight:600;
}

.total{
    font-size:20px;
    font-weight:700;
    color:#16a34a;
}

.net{
    color:#2563eb !important;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#94a3b8;
    font-size:12px;
}
</style>
</head>
<body>

<div class="card">

<h1>💰 Калькулятор зарплати</h1>

<div class="subtitle">
Розрахунок зарплати GROSS та NET
</div>

<div class="input-group">
<label>Відпрацьовано годин</label>
<input type="number" id="hours" min="0" placeholder="Введіть години">
</div>

<div class="input-group">
<label>Фактична результативність</label>
<input type="number" id="productivity" min="0" placeholder="Введіть результативність">
</div>

<div class="result">

<div class="section-title">Нарахування (GROSS)</div>

<div class="row">
<span>Оплата годин</span>
<span id="hoursPay">—</span>
</div>

<div class="row">
<span>Стартовий бонус</span>
<span id="startBonus">—</span>
</div>

<div class="row">
<span>Бонус за результативність</span>
<span id="resultBonus">—</span>
</div>

<div class="row total">
<span>Загалом GROSS</span>
<span id="grossTotal">—</span>
</div>

<div class="section-title">До виплати</div>

<div class="row">
<span>Податки (22%)</span>
<span id="taxes">—</span>
</div>

<div class="row total">
<span class="net">Загалом NET</span>
<span class="net" id="netTotal">—</span>
</div>

</div>

<div class="footer">
</div>

</div>

<script>

const HOURLY_RATE = 133.50;
const TARGET = 99;
const START_TARIFF = 0.25;
const TAX = 0.22;

function getBonusTariff(productivity){

    if(productivity <= 99) return 0;

    if(productivity < 120) return 0.6;
    if(productivity < 150) return 1;
    if(productivity < 200) return 1.4;

    return 1.6;
}

function formatMoney(value){
    return value.toLocaleString('uk-UA',{
        minimumFractionDigits:2,
        maximumFractionDigits:2
    }) + ' грн';
}

function calculate(){

    const hoursInput =
        document.getElementById('hours').value;

    const productivityInput =
        document.getElementById('productivity').value;

    if(hoursInput === '' || productivityInput === ''){

        document.getElementById('hoursPay').textContent = '—';
        document.getElementById('startBonus').textContent = '—';
        document.getElementById('resultBonus').textContent = '—';
        document.getElementById('grossTotal').textContent = '—';
        document.getElementById('taxes').textContent = '—';
        document.getElementById('netTotal').textContent = '—';

        return;
    }

    const hours = Number(hoursInput);
    const productivity = Number(productivityInput);

    const hoursPay =
        hours * HOURLY_RATE;

    const startBonus =
        productivity >= TARGET
        ? TARGET * START_TARIFF * hours
        : 0;

    const tariff =
        getBonusTariff(productivity);

    const resultBonus =
        productivity > TARGET
        ? (productivity - TARGET) * hours * tariff
        : 0;

    const gross =
        hoursPay +
        startBonus +
        resultBonus;

    const taxes =
        gross * TAX;

    const net =
        gross - taxes;

    document.getElementById('hoursPay').textContent =
        formatMoney(hoursPay);

    document.getElementById('startBonus').textContent =
        formatMoney(startBonus);

    document.getElementById('resultBonus').textContent =
        formatMoney(resultBonus);

    document.getElementById('grossTotal').textContent =
        formatMoney(gross);

    document.getElementById('taxes').textContent =
        formatMoney(taxes);

    document.getElementById('netTotal').textContent =
        formatMoney(net);
}

document.getElementById('hours')
.addEventListener('input', calculate);

document.getElementById('productivity')
.addEventListener('input', calculate);

window.onload = calculate;

</script>

</body>
</html>
