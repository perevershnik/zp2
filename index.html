<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Калькулятор зарплати</title>
<style>
*{box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif}
body{margin:0;background:#eef2f7;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{background:#fff;max-width:650px;width:100%;padding:28px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
h1{text-align:center;margin-top:0}
.field{margin:18px 0}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=number]{width:100%;padding:12px;font-size:18px;border:1px solid #ccc;border-radius:10px}
.row,.total{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}
.total{border:none;font-size:26px;font-weight:700;color:#11823b;padding-top:18px}
.info{background:#f5f5f5;padding:12px;border-radius:10px;margin:18px 0}
</style>
</head>
<body>
<div class="card">
<h1>Калькулятор зарплати</h1>

<div class="field">
<label>Відпрацьовано годин</label>
<input id="hours" type="number" value="133">
</div>

<div class="field">
<label>Фактична результативність</label>
<input id="fact" type="number" value="133">
</div>

<div class="info">
<div>Ціль по результативності: <b>99</b></div>
<div>Ставка: <b>102.80 грн/год</b></div>
<div>Стартовий тариф: <b>0.25</b></div>
<div>Податок на бонуси: <b>22%</b></div>
</div>

<div class="row"><span>Основна зарплата</span><b id="salary"></b></div>
<div class="row"><span>Тариф перевиконання</span><b id="over"></b></div>
<div class="row"><span>Стартовий бонус</span><b id="start"></b></div>
<div class="row"><span>Бонус за результативність</span><b id="perf"></b></div>
<div class="row"><span><b>Загальний бонус</b></span><b id="bonus"></b></div>
<div class="total"><span>Загальний дохід</span><span id="total"></span></div>

</div>

<script>
const GOAL=99,HOUR_RATE=102.8,START_RATE=0.25,TAX=0.22;
const hours=document.getElementById('hours');
const fact=document.getElementById('fact');

function money(v){
 return v.toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2})+' грн';
}

function calc(){
 const h=+hours.value||0;
 const f=+fact.value||0;

 const salary=h*HOUR_RATE;

 let over=0;
 if(f>GOAL){
   if(f<120) over=0.6;
   else if(f<150) over=1;
   else if(f<200) over=1.4;
   else over=1.6;
 }

 let start=(f>=GOAL)?GOAL*START_RATE*h:0;
 let perf=(start>0)?(f-GOAL)*h*over:0;

 start*=0.78;
 perf*=0.78;

 const bonus=start+perf;
 const total=salary+bonus;

 document.getElementById('salary').textContent=money(salary);
 document.getElementById('over').textContent=over.toFixed(2);
 document.getElementById('start').textContent=money(start);
 document.getElementById('perf').textContent=money(perf);
 document.getElementById('bonus').textContent=money(bonus);
 document.getElementById('total').textContent=money(total);
}
hours.oninput=calc;
fact.oninput=calc;
calc();
</script>
</body>
</html>
