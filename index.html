<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор зарплати</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    background:#eef2f7;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:25px;
}

.card{
    width:100%;
    max-width:650px;
    background:#fff;
    border-radius:18px;
    padding:30px;
    box-shadow:0 12px 35px rgba(0,0,0,.12);
}

h1{
    text-align:center;
    margin-bottom:25px;
}

.field{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
}

input{
    width:100%;
    padding:13px;
    font-size:18px;
    border-radius:10px;
    border:1px solid #ccc;
}

.info{
    margin:25px 0;
    padding:15px;
    background:#f7f7f7;
    border-radius:10px;
}

.info div{
    display:flex;
    justify-content:space-between;
    margin:8px 0;
}

.result{
    margin-top:25px;
    border-top:2px solid #eee;
    padding-top:20px;
}

.row{
    display:flex;
    justify-content:space-between;
    margin:12px 0;
    font-size:18px;
}

.total{
    margin-top:25px;
    border-top:2px solid #ddd;
    padding-top:20px;
    font-size:28px;
    color:#11823b;
    font-weight:bold;
    display:flex;
    justify-content:space-between;
}

.green{
    color:#11823b;
    font-weight:bold;
}

.gray{
    color:#777;
}
</style>

</head>
<body>

<div class="card">

<h1>Калькулятор зарплати</h1>

<div class="field">
<label>Відпрацьовано годин</label>
<input id="hours" type="number" value="133">
</div>

<div class="field">
<label>Фактична результативність</label>
<input id="fact" type="number" value="133">
</div>

<div class="field">
<label>Ціль по результативності</label>
<input id="goal" type="number" value="99">
</div>

<div class="info">
<div><span>Ставка за 1 годину</span><b>102.80 грн</b></div>
<div><span>Тариф стартового бонусу</span><b>0.25</b></div>
</div>

<div class="result">

<div class="row">
<span>Основна зарплата</span>
<b id="salary"></b>
</div>

<div class="row">
<span>Тариф перевиконання</span>
<b id="overRate"></b>
</div>

<div class="row">
<span>Стартовий бонус</span>
<b id="startBonus"></b>
</div>

<div class="row">
<span>Бонус за результативність</span>
<b id="perfBonus"></b>
</div>

<div class="row">
<span>Коефіцієнт (15%)</span>
<b id="coef"></b>
</div>

<div class="row green">
<span>Загальний бонус</span>
<b id="bonus"></b>
</div>

<div class="total">
<span>Загальний дохід</span>
<span id="total"></span>
</div>

</div>

</div>

<script>

const HOUR_RATE = 102.8;
const START_RATE = 0.25;

const hours=document.getElementById("hours");
const fact=document.getElementById("fact");
const goal=document.getElementById("goal");

document.querySelectorAll("input").forEach(i=>i.addEventListener("input",calc));

function money(x){
    return x.toLocaleString("uk-UA",{
        minimumFractionDigits:2,
        maximumFractionDigits:2
    })+" грн";
}

function calc(){

const h=Number(hours.value)||0;
const f=Number(fact.value)||0;
const g=Number(goal.value)||0;

const salary=h*HOUR_RATE;

let overRate=0;

if(f>g){
    if(f<120)
        overRate=0.6;
    else if(f<150)
        overRate=1;
    else if(f<200)
        overRate=1.4;
    else
        overRate=1.6;
}

const startBonus=(f>=g)?g*START_RATE*h:0;

const perfBonus=(startBonus>0)?(f-g)*h*overRate:0;

const coef=(startBonus+perfBonus)*0.15;

const bonus=startBonus+perfBonus+coef;

const total=salary+bonus;

document.getElementById("salary").textContent=money(salary);
document.getElementById("overRate").textContent=overRate.toFixed(2);
document.getElementById("startBonus").textContent=money(startBonus);
document.getElementById("perfBonus").textContent=money(perfBonus);
document.getElementById("coef").textContent=money(coef);
document.getElementById("bonus").textContent=money(bonus);
document.getElementById("total").textContent=money(total);

}

calc();

</script>

</body>
</html>
