<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор бонусу</title>

<style>
*{
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    margin:0;
    background:#f3f5f7;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card{
    width:100%;
    max-width:600px;
    background:white;
    border-radius:18px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
    margin-top:0;
    text-align:center;
}

.field{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:600;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #d8d8d8;
    border-radius:10px;
    font-size:17px;
}

.result{
    margin-top:25px;
    border-top:2px solid #eee;
    padding-top:20px;
}

.item{
    display:flex;
    justify-content:space-between;
    margin:12px 0;
    font-size:18px;
}

.total{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid #ddd;
    font-size:24px;
    font-weight:bold;
    color:#0b7a33;
}

small{
    color:#888;
}
</style>

</head>
<body>

<div class="card">

<h1>Калькулятор бонусу</h1>

<div class="field">
<label>Відпрацьовано годин</label>
<input id="hours" type="number" value="133">
</div>

<div class="field">
<label>Фактична результативність</label>
<input id="fact" type="number" value="133">
</div>

<div class="field">
<label>Ціль по результативності</label>
<input id="goal" type="number" value="99">
</div>

<div class="field">
<label>Тариф стартового бонусу</label>
<input id="rate" type="number" step="0.01" value="0.25">
</div>

<div class="result">

<div class="item">
<span>Тариф перевиконання</span>
<b id="overRate"></b>
</div>

<div class="item">
<span>Стартовий бонус</span>
<b id="startBonus"></b>
</div>

<div class="item">
<span>Бонус за результативність</span>
<b id="perfBonus"></b>
</div>

<div class="item">
<span>Коефіцієнт (15%)</span>
<b id="coef"></b>
</div>

<div class="total">
Загальний бонус:
<span id="total"></span>
</div>

</div>

<small>Розрахунок повністю відповідає Excel.</small>

</div>

<script>

const inputs=document.querySelectorAll("input");

inputs.forEach(i=>i.addEventListener("input",calc));

function money(x){
    return x.toLocaleString("uk-UA",{
        minimumFractionDigits:2,
        maximumFractionDigits:2
    })+" грн";
}

function calc(){

let hours=Number(hoursInput.value);
let fact=Number(factInput.value);
let goal=Number(goalInput.value);
let rate=Number(rateInput.value);

let overRate=0;

if(fact>goal){

    if(fact<120)
        overRate=0.6;
    else if(fact<150)
        overRate=1;
    else if(fact<200)
        overRate=1.4;
    else
        overRate=1.6;
}

let startBonus=0;

if(fact>=goal)
    startBonus=goal*rate*hours;

let perfBonus=0;

if(startBonus>0)
    perfBonus=(fact-goal)*hours*overRate;

let coef=(startBonus+perfBonus)*0.15;

let total=startBonus+perfBonus+coef;

document.getElementById("overRate").textContent=overRate.toFixed(2);

document.getElementById("startBonus").textContent=money(startBonus);

document.getElementById("perfBonus").textContent=money(perfBonus);

document.getElementById("coef").textContent=money(coef);

document.getElementById("total").textContent=money(total);

}

const hoursInput=document.getElementById("hours");
const factInput=document.getElementById("fact");
const goalInput=document.getElementById("goal");
const rateInput=document.getElementById("rate");

calc();

</script>

</body>
</html>
