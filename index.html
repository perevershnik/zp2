<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор зарплати</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}

body{
    background:#f5f7fa;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:500px;
    background:white;
    border-radius:24px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    margin-bottom:25px;
    color:#222;
    font-size:28px;
}

.input-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#555;
    font-weight:600;
}

input{
    width:100%;
    padding:14px;
    border:2px solid #e5e7eb;
    border-radius:14px;
    font-size:18px;
    transition:.2s;
}

input:focus{
    outline:none;
    border-color:#2563eb;
}

.result{
    margin-top:25px;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.total{
    margin-top:15px;
    padding-top:15px;
    border-top:2px solid #ddd;
    font-size:24px;
    font-weight:700;
    color:#16a34a;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#888;
    font-size:12px;
}
</style>
</head>
<body>

<div class="card">

<h1>💰 Калькулятор зарплати</h1>

<div class="input-group">
<label>Відпрацьовано годин</label>
<input type="number" id="hours" value="0">
</div>

<div class="input-group">
<label>Фактична результативність</label>
<input type="number" id="productivity" value="100">
</div>

<div class="result">

<div class="row">
<span>Оплата годин</span>
<span id="hoursPay">0 грн</span>
</div>

<div class="row">
<span>Стартовий бонус</span>
<span id="startBonus">0 грн</span>
</div>

<div class="row">
<span>Бонус за результативність</span>
<span id="resultBonus">0 грн</span>
</div>

<div class="row total">
<span>Зарплата NET</span>
<span id="totalSalary">0 грн</span>
</div>

</div>

<div class="footer">
Версія 1.0
</div>

</div>

<script>

const RATE = 102.8;
const TARGET = 100;
const START_TARIFF = 0.6;

function calculate(){

    const hours = Number(document.getElementById('hours').value) || 0;
    const productivity = Number(document.getElementById('productivity').value) || 0;

    const hoursPay = hours * RATE;

    let bonusTariff = 0;

    if(productivity > TARGET){
        if(productivity < 120){
            bonusTariff = 0.6;
        }else if(productivity < 150){
            bonusTariff = 1;
        }else if(productivity < 200){
            bonusTariff = 1.4;
        }else{
            bonusTariff = 1.6;
        }
    }

    const startBonus =
        productivity >= TARGET
        ? TARGET * START_TARIFF * hours * 0.78
        : 0;

    const resultBonus =
        productivity > TARGET
        ? (productivity - TARGET) * hours * bonusTariff * 0.78
        : 0;

    const total =
        hoursPay +
        startBonus +
        resultBonus;

    document.getElementById('hoursPay').innerText =
        hoursPay.toFixed(2) + ' грн';

    document.getElementById('startBonus').innerText =
        startBonus.toFixed(2) + ' грн';

    document.getElementById('resultBonus').innerText =
        resultBonus.toFixed(2) + ' грн';

    document.getElementById('totalSalary').innerText =
        total.toFixed(2) + ' грн';
}

document.getElementById('hours').addEventListener('input',calculate);
document.getElementById('productivity').addEventListener('input',calculate);

calculate();

</script>

</body>
</html>
