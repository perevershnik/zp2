<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор зарплати</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}

body{
background:#f4f6f8;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
width:100%;
max-width:550px;
background:#fff;
border-radius:24px;
padding:30px;
box-shadow:0 15px 40px rgba(0,0,0,.08);
}

h1{
text-align:center;
margin-bottom:25px;
color:#222;
font-size:28px;
}

.input-group{
margin-bottom:20px;
}

label{
display:block;
margin-bottom:8px;
font-weight:600;
color:#444;
}

input{
width:100%;
padding:14px;
font-size:18px;
border:2px solid #e5e7eb;
border-radius:14px;
transition:.2s;
}

input:focus{
outline:none;
border-color:#2563eb;
}

.result{
margin-top:25px;
}

.row{
display:flex;
justify-content:space-between;
padding:12px 0;
border-bottom:1px solid #eee;
}

.total{
font-size:24px;
font-weight:700;
color:#16a34a;
margin-top:10px;
border-bottom:none;
}

.hidden{
display:none;
}
</style>
</head>
<body>

<div class="card">

<h1>💰 Калькулятор зарплати</h1>

<div class="input-group">
<label>Відпрацьовано годин</label>
<input type="number" id="hours" value="0">
</div>

<div class="input-group">
<label>Фактична результативність</label>
<input type="number" id="productivity" value="99">
</div>

<!-- Скрытые поля из Excel -->
<div class="hidden">
<input id="target" value="99">
<input id="startTariff" value="0.25">
</div>

<div class="result">

<div class="row">
<span>Оплата годин</span>
<span id="hoursPay">0 грн</span>
</div>

<div class="row">
<span>Стартовий бонус</span>
<span id="startBonus">0 грн</span>
</div>

<div class="row">
<span>Бонус за результативність</span>
<span id="resultBonus">0 грн</span>
</div>

<div class="row total">
<span>Загальна зарплата</span>
<span id="totalSalary">0 грн</span>
</div>

</div>

</div>

<script>

function getOverTariff(productivity){

if(productivity <= 99) return 0;

if(productivity < 120) return 0.6;
if(productivity < 150) return 1;
if(productivity < 200) return 1.4;

return 1.6;
}

function calculate(){

const hours = Number(document.getElementById('hours').value) || 0;
const productivity = Number(document.getElementById('productivity').value) || 0;

const target = 99;
const startTariff = 0.25;

const hoursPay = hours * 102.8;

const startBonus =
productivity >= target
? target * startTariff * hours * 0.78
: 0;

const overTariff = getOverTariff(productivity);

const resultBonus =
startBonus > 0
? (productivity - target) * hours * overTariff * 0.78
: 0;

const total =
hoursPay +
startBonus +
resultBonus;

document.getElementById('hoursPay').textContent =
hoursPay.toFixed(2) + " грн";

document.getElementById('startBonus').textContent =
startBonus.toFixed(2) + " грн";

document.getElementById('resultBonus').textContent =
resultBonus.toFixed(2) + " грн";

document.getElementById('totalSalary').textContent =
total.toFixed(2) + " грн";
}

document.getElementById('hours').addEventListener('input', calculate);
document.getElementById('productivity').addEventListener('input', calculate);

calculate();

</script>

</body>
</html>
