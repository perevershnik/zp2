<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор зарплати</title>
<style>
*{box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif}
body{margin:0;background:#eef2f7;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{width:100%;max-width:680px;background:#fff;border-radius:18px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
h1{text-align:center;margin-top:0}
.field{margin:16px 0}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=number]{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:18px}
input[readonly]{background:#f3f3f3;color:#666}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}
.total{display:flex;justify-content:space-between;font-size:26px;font-weight:bold;color:#11823b;padding-top:18px}
.info{background:#f7f7f7;border-radius:10px;padding:12px;margin:16px 0}
</style>
</head>
<body>
<div class="card">
<h1>Калькулятор зарплати</h1>

<div class="field">
<label>Відпрацьовано годин</label>
<input id="hours" type="number" value="133">
</div>

<div class="field">
<label>Фактична результативність</label>
<input id="fact" type="number" value="133">
</div>

<div class="field">
<label>Ціль по результативності</label>
<input id="goal" type="number" value="99" readonly>
</div>

<div class="field">
<label><input id="guestGoal" type="checkbox"> Ціль по оцінці гостя виконана (+15%)</label>
</div>

<div class="info">
<div>Ставка за годину: <b>102.80 грн</b></div>
<div>Стартовий тариф: <b>0.25</b></div>
<div>Податок на бонуси: <b>22%</b></div>
</div>

<div class="row"><span>Основна зарплата</span><b id="salary"></b></div>
<div class="row"><span>Тариф перевиконання</span><b id="overRate"></b></div>
<div class="row"><span>Стартовий бонус</span><b id="startBonus"></b></div>
<div class="row"><span>Бонус за результативність</span><b id="perfBonus"></b></div>
<div class="row"><span>Коефіцієнт 15%</span><b id="coef"></b></div>
<div class="row"><span><b>Загальний бонус</b></span><b id="bonus"></b></div>
<div class="total"><span>Загальний дохід</span><span id="total"></span></div>

</div>

<script>
const HOUR_RATE=102.8;
const START_RATE=0.25;
const TAX=0.22;

const hours=document.getElementById('hours');
const fact=document.getElementById('fact');
const goal=document.getElementById('goal');
const guest=document.getElementById('guestGoal');

function money(v){
 return v.toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2})+' грн';
}

function calc(){
 const h=+hours.value||0;
 const f=+fact.value||0;
 const g=+goal.value||0;

 const salary=h*HOUR_RATE;

 let over=0;
 if(f>g){
   if(f<120) over=0.6;
   else if(f<150) over=1;
   else if(f<200) over=1.4;
   else over=1.6;
 }

 let start=(f>=g)?g*START_RATE*h:0;
 let perf=(start>0)?(f-g)*h*over:0;

 start*=1-TAX;
 perf*=1-TAX;

 let coef=0;
 if(guest.checked){
   coef=(start+perf)*0.15;
 }

 const bonus=start+perf+coef;
 const total=salary+bonus;

 document.getElementById('salary').textContent=money(salary);
 document.getElementById('overRate').textContent=over.toFixed(2);
 document.getElementById('startBonus').textContent=money(start);
 document.getElementById('perfBonus').textContent=money(perf);
 document.getElementById('coef').textContent=guest.checked?money(coef):'0.00 грн';
 document.getElementById('bonus').textContent=money(bonus);
 document.getElementById('total').textContent=money(total);
}
[hours,fact,guest].forEach(e=>e.addEventListener('input',calc));
calc();
</script>
</body>
</html>
