<style>
body {
  font-family:"Inter",Arial,sans-serif;
  margin:0;
  padding:1rem;
  background:radial-gradient(circle at top left, #e3f2fd, #fce4ec);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}
.hidden { display:none; }

.menu, .container {
  width:90%;
  max-width:400px;
  background:rgba(255,255,255,0.7);
  border-radius:20px;
  box-shadow:0 4px 30px rgba(0,0,0,0.1);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  padding:1.5rem;
  animation:fadeIn 1s ease;
  text-align:center;
}
.menu h1, .container h1 {
  margin-bottom:1rem;
  color:#333;
  font-size:1.6rem;
}

.menu button, .calc-btn {
  width:100%;
  padding:0.7rem;
  font-size:1rem;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#64b5f6,#ba68c8);
  color:#fff;
  cursor:pointer;
  margin-bottom:0.6rem;
  transition:transform 0.2s ease, box-shadow 0.3s ease;
}
.menu button:hover, .calc-btn:hover {
  transform:scale(1.03);
  box-shadow:0 0 10px rgba(100,181,246,0.5);
}
.menu button:active, .calc-btn:active { transform:scale(0.97); }

@keyframes fadeIn {
  from { opacity:0; transform:translateY(15px);}
  to { opacity:1; transform:translateY(0);}
}

label {
  display:block;
  margin:0.6rem 0 0.3rem;
  color:#333;
  font-size:0.9rem;
  font-weight:500;
  text-align:left;
  width:100%;
}

.input-with-sum {
  position:relative;
  width:100%;
}
.input-with-sum input {
  width:100%;
  padding-right:4.5rem;
  box-sizing:border-box;
}
.input-sum {
  position:absolute;
  right:0.8rem;
  top:50%;
  transform:translateY(-50%);
  color:rgba(0,0,0,0.6);
  font-size:0.85rem;
  pointer-events:none;
}

input, select {
  display:block;
  width:100%;
  box-sizing:border-box;
  padding:0.5rem;
  margin-bottom:0.8rem;
  border:1px solid rgba(0,0,0,0.2);
  border-radius:10px;
  background:rgba(255,255,255,0.9);
  color:#222;
  font-size:1rem;
  text-align:center;
  transition:box-shadow 0.3s ease, transform 0.2s ease;
}
input:focus, select:focus {
  outline:none;
  box-shadow:0 0 10px rgba(100,181,246,0.8);
  transform:scale(1.02);
}

.result {
  text-align:center;
  margin-top:1rem;
  font-weight:bold;
  font-size:1.2rem;
  color:#222;
  transition: all 0.3s ease;
}
.buttons {
  display:flex;
  flex-direction:column;
  gap:0.5rem;
  margin-top:0.8rem;
}
.footer {
  margin-top:1rem;
  font-size:0.75rem;
  color:rgba(0,0,0,0.5);
  text-align:center;
  user-select:none;
}

.switch { position:relative; display:inline-block; width:50px; height:26px; vertical-align:middle; }
.switch input { opacity:0; width:0; height:0; }
.slider {
  position:absolute;
  cursor:pointer;
  top:0; left:0; right:0; bottom:0;
  background-color:#ccc;
  transition:0.4s;
  border-radius:34px;
}
.slider:before {
  position:absolute;
  content:"";
  height:20px;
  width:20px;
  left:3px;
  bottom:3px;
  background-color:white;
  transition:0.4s;
  border-radius:50%;
}
input:checked + .slider { background-color:#64b5f6; }
input:checked + .slider:before { transform: translateX(24px); }

.toggle-label {
  display:flex;
  align-items:center;
  gap:0.5rem;
  margin-bottom:1rem;
  font-size:0.9rem;
  color:#333;
}
#qrContainer {
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-top:20px;
}

/* Новый блок обновлений */

  width: 90%;
  max-width: 400px;

  border-radius: 16px;

#qrContainer .qr-label {display:none!important;}

.results-box{

<body>

<!-- Меню -->
<div class="menu" id="menu">

</div>

</div>

<!-- QR-коди -->
<div class="container hidden" id="qrBlock">
  <h1>📱 QR-коди комірок</h1>
  <label>Пошук комірки:</label>
  <div style="display:flex; gap:0.5rem; align-items:center;">
    <input type="tel" inputmode="numeric" id="searchCell" placeholder="Наприклад: 71" style="flex:1;" />
    <button class="calc-btn" id="clearSearch" style="width:auto; padding:0.5rem 1rem;">🧹</button>
  </div>
  <label>Виберіть комірку:</label>
  <select id="cellSelect" size="8"></select>
  <div id="qrContainer"></div>
  <!-- UUID field + copy button -->
  <div id="uuidBox" style="display:none; width:100%; margin-top:10px; display:flex; align-items:stretch; gap:6px; justify-content:center;">
    <input id="uuidField" readonly style="flex:1; padding:0.4rem; border-radius:8px; border:1px solid rgba(0,0,0,0.25); background:rgba(255,255,255,0.85); text-align:center;">
    <button id="copyUUID" style="width:42px; padding:0.4rem; border-radius:8px; border:none; background:linear-gradient(90deg,#64b5f6,#ba68c8); color:white; font-size:18px; cursor:pointer;">📋</button>
  </div>

  <div class="buttons">
    <button class="calc-btn" id="backQR">⬅️ Повернутись у меню</button>
  </div>
</div>

<div class="footer">Version 2.1 © 2025 Стоцький В.В.</div>

<script>
const menu=document.getElementById('menu');
const calculator=document.getElementById('calculator');
const qrBlock=document.getElementById('qrBlock');
const updates=document.querySelector('.updates');

document.getElementById('btnZP').onclick=()=>{
  menu.classList.add('hidden');
  updates.classList.add('hidden');
  calculator.classList.remove('hidden');
};
document.getElementById('btnQR').onclick=()=>{
  menu.classList.add('hidden');
  updates.classList.add('hidden');
  qrBlock.classList.remove('hidden');
};
document.getElementById('back').onclick=()=>{
  calculator.classList.add('hidden');
  menu.classList.remove('hidden');
  updates.classList.remove('hidden');
};
document.getElementById('backQR').onclick=()=>{
  qrBlock.classList.add('hidden');
  menu.classList.remove('hidden');
  updates.classList.remove('hidden');
};


const hourlyRate=133.50;
const target=99;

function updateCalc(){
 const hours=+document.getElementById('hours').value||0;
 const perf=+document.getElementById('performance').value||0;

 const salary=hours*hourlyRate;

 let startBonus=0;
 if(perf>=target){
   startBonus=target*hours*0.25;
 }

 let rate=0;
 if(perf>=200) rate=1.6;
 else if(perf>=150) rate=1.4;
 else if(perf>=120) rate=1.0;
 else if(perf>=99) rate=0.6;

 let extraBonus=0;
 if(perf>target){
   extraBonus=(perf-target)*hours*rate;
 }

 const gross=salary+startBonus+extraBonus;
 const net=gross*0.78;

 document.getElementById('salaryGross').textContent='💰 Зарплата за години: '+(salary*0.78).toFixed(2)+' грн';
 document.getElementById('bonusStart').textContent='🎯 Стартовий бонус: '+(startBonus*0.78).toFixed(2)+' грн';
 document.getElementById('bonusExtra').textContent='🚀 Бонус за перевиконання: '+(extraBonus*0.78).toFixed(2)+' грн';
 document.getElementById('totalGross').innerHTML=
'<div style="font-size:.8rem;opacity:.7;letter-spacing:1px;">ВСЬОГО ДО ВИПЛАТИ</div>'+
'<div style="font-size:1.8rem;font-weight:800;margin-top:6px;">'+
net.toFixed(2)+' грн</div>';
 document.getElementById('totalNet').textContent='💳 Після податку 22%: '+net.toFixed(2)+' грн';
}

document.getElementById('hours').oninput=updateCalc;
document.getElementById('performance').oninput=updateCalc;

document.getElementById('reset').onclick=()=>{
 document.getElementById('hours').value='';
 document.getElementById('performance').value='';
 updateCalc();
};

const qrData={};
for(let s=1;s<=85;s++){for(let p=1;p<=6;p++){qrData[`${s}-${p}`]="";}}
qrData["1-1"]="187d9487-bc1a-4d1e-979c-e1f66c017a16";
qrData["1-2"]="86466417-4d36-4343-9318-c97d49b41b59";

qrData["99-2"]="b51ab649-d994-4002-9d74-141f690510fb";

const cellSelect=get('cellSelect'),searchCell=get('searchCell');
function fillSelect(filter=""){ cellSelect.innerHTML='<option value="">Виберіть комірку</option>';
  for(let key in qrData){ if(key.toLowerCase().includes(filter.toLowerCase())){ let o=document.createElement('option'); o.value=key;o.textContent=key;cellSelect.appendChild(o);} } }
fillSelect();

searchCell.oninput=e=>{ e.target.value=e.target.value.replace(/[^0-9\-]/g,''); fillSelect(e.target.value); };
get('clearSearch').onclick=()=>{ searchCell.value=''; fillSelect(); searchCell.focus(); };
cellSelect.onchange=()=>{ const qrC=get('qrContainer'); qrC.innerHTML=''; const v=cellSelect.value;
  if(v){ const data=qrData[v]||""; if(!data){ let p=document.createElement('p'); p.textContent='🔔 Для цієї комірки значення ще не задано.'; p.style.color='rgba(0,0,0,0.6)'; qrC.appendChild(p);} else new QRCode(qrC,{text:data,width:200,height:200,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H}); }};
updateTotal();
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // Ensure qrData exists
  if (typeof qrData === 'undefined') {
    console.warn('qrData not found');
    return;
  }

  const qrContainer = document.getElementById('qrContainer');
  const cellSelect = document.getElementById('cellSelect');
  const searchCell = document.getElementById('searchCell');
  const clearSearch = document.getElementById('clearSearch');
  const uuidBox = document.getElementById('uuidBox');
  const uuidField = document.getElementById('uuidField');
  const copyUUIDbtn = document.getElementById('copyUUID');

  // Small helper to clear QR display
  function clearQR() {
    qrContainer.innerHTML = '';
    uuidField.value = '';
    uuidBox.style.display = 'none';
  }

  // Populate select with keys from qrData (sorted naturally)
  const keys = Object.keys(qrData).filter(k => qrData[k]).sort((a,b)=>{
    // sort by numeric rack-row like "12-3"
    const [as,ap] = a.split('-').map(Number);
    const [bs,bp] = b.split('-').map(Number);
    if (as === bs) return ap - bp;
    return as - bs;
  });
  keys.forEach(k=>{
    const opt = document.createElement('option');
    opt.value = k;
    opt.textContent = k;
    cellSelect.appendChild(opt);
  });

  // Generate QR for a given key (if uuid present)
  let currentQRCode = null;
  function renderQR(key) {
    const uuid = qrData[key] || '';
    qrContainer.innerHTML = '';
    if (!uuid) {
      uuidBox.style.display = 'none';
      return;
    }
    // Create wrapper so we can add label under QR if desired
    const wrap = document.createElement('div');
    wrap.style.display = 'flex';
    wrap.style.flexDirection = 'column';
    wrap.style.alignItems = 'center';
    wrap.style.gap = '8px';
    // QR size responsive: smaller on narrow screens
    const size = Math.max(120, Math.min(220, Math.floor(window.innerWidth * 0.35)));
    const qrEl = document.createElement('div');
    qrEl.id = 'generatedQR';
    wrap.appendChild(qrEl);
    // optional label
    const lbl = document.createElement('div'); lbl.className = 'qr-label';
    lbl.textContent = key;
    lbl.style.fontSize = '0.9rem';
    lbl.style.color = '#222';
    wrap.appendChild(lbl);

    qrContainer.appendChild(wrap);
    try {
      currentQRCode = new QRCode(qrEl, {
        text: uuid,
        width: size,
        height: size,
        colorDark:"#000000",
        colorLight:"#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    } catch (e) {
      // fallback: show text
      qrEl.textContent = uuid;
    }

    // show uuid and copy button
    uuidField.value = uuid;
    uuidBox.style.display = 'flex';

    // on small screens, scroll to qrContainer so user sees QR
    setTimeout(()=>{
      qrContainer.scrollIntoView({behavior:'smooth', block:'center'});
    }, 120);
  }

  // handle select change
  cellSelect.addEventListener('change', ()=>{
    const key = cellSelect.value;
    if (!key) return clearQR();
    renderQR(key);
  });

  // filter select with search input (mobile-friendly)
  function filterSelect(q) {
    const ql = q.trim().toLowerCase();
    // Save currently selected value
    const prev = cellSelect.value;
    cellSelect.innerHTML = '';
    keys.forEach(k=>{
      if (!ql || k.toLowerCase().includes(ql)) {
        const opt = document.createElement('option');
        opt.value = k;
        opt.textContent = k;
        cellSelect.appendChild(opt);
      }
    });
    // try to restore selection if still present
    if (prev && Array.from(cellSelect.options).some(o=>o.value===prev)) {
      cellSelect.value = prev;
    } else if (cellSelect.options.length>0) {
      cellSelect.selectedIndex = 0;
      // render first match
      renderQR(cellSelect.value);
    } else {
      clearQR();
    }
  }

  searchCell.addEventListener('input', (e)=>{
    filterSelect(e.target.value);
  });

  clearSearch.addEventListener('click', ()=>{
    searchCell.value = '';
    filterSelect('');
    searchCell.focus();
  });

  // Initially, if any option exists, render first
  if (cellSelect.options.length>0) {
    // select first visible
    cellSelect.selectedIndex = 0;
    renderQR(cellSelect.value);
  }

  // Copy functionality: try navigator.clipboard, fallback to selection
  copyUUIDbtn.addEventListener('click', async ()=>{
    const text = uuidField.value || '';
    if (!text) return;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      } else {
        // iOS Safari workaround: temporarily make input editable and select
        uuidField.removeAttribute('readonly');
        uuidField.select();
        uuidField.setSelectionRange(0, text.length);
        document.execCommand('copy');
        uuidField.setAttribute('readonly', 'readonly');
        // deselect
        window.getSelection().removeAllRanges();
      }
      // visual feedback
      const orig = copyUUIDbtn.innerHTML;
      copyUUIDbtn.innerHTML = '✅';
      setTimeout(()=>{ copyUUIDbtn.innerHTML = orig; }, 900);
    } catch (err) {
      console.error('Copy failed', err);
      // fallback: prompt with the UUID so user can long-press to copy on mobile
      alert('Копіювання не вдалося автоматично. Скопіюйте вручну:\n' + text);
    }
  });

  // Make sure touch events don't break selection on mobile within the select
  cellSelect.addEventListener('touchstart', (e)=>{ /* noop to improve responsiveness */ });

  // Accessibility: allow Enter on search to focus select
  searchCell.addEventListener('keydown', (e)=>{
    if (e.key === 'Enter') {
      e.preventDefault();
      if (cellSelect.options.length>0) {
        cellSelect.focus();
      }
    }
  });

  // Resize handler to re-render QR for better size on orientation change
  window.addEventListener('orientationchange', ()=> {
    if (cellSelect.value) {
      renderQR(cellSelect.value);
    }
  });
});
</script>
